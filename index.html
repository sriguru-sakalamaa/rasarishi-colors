<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Electromagnetic Spectrum (Static)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b1020;
      color: #f8fafc;
      padding: 20px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: #111827;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 18px;
    }
    h1 { margin: 0 0 8px; font-size: 1.6rem; }
    p { margin: 0 0 14px; color: #cbd5e1; }

    .axis {
      position: relative;
      height: 92px;
      border: 1px solid #64748b;
      border-radius: 10px;
      overflow: hidden;
      background: #1e293b;
    }

    .band {
      position: absolute;
      top: 0;
      bottom: 0;
      border-right: 1px solid rgba(255,255,255,0.35);
      font-size: 12px;
      font-weight: bold;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 7px;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.8);
      white-space: nowrap;
    }

    .visible-strip {
      position: absolute;
      top: 44px;
      height: 36px;
      border: 1px solid rgba(255,255,255,.7);
      background: linear-gradient(to right,
        #6d28d9 0%, #2563eb 18%, #06b6d4 36%,
        #22c55e 52%, #eab308 68%, #f97316 84%, #ef4444 100%);
    }

    .indicator {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #fff;
      box-shadow: 0 0 10px rgba(255,255,255,0.8);
      transform: translateX(-50%);
      z-index: 5;
    }

    .ticks { position: relative; height: 42px; margin-top: 7px; }
    .tick {
      position: absolute;
      transform: translateX(-50%);
      font-size: 11px;
      color: #e2e8f0;
      text-align: center;
    }
    .tick::before {
      content: "";
      display: block;
      width: 1px;
      height: 7px;
      margin: 0 auto 3px;
      background: #cbd5e1;
    }

    .controls {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr 260px;
      gap: 12px;
      align-items: center;
    }
    input[type="range"] { width: 100%; }

    .readout {
      border: 1px solid #475569;
      border-radius: 8px;
      background: #0f172a;
      padding: 10px;
      font-size: 14px;
    }
    .sample {
      margin-top: 8px;
      height: 36px;
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 6px;
      background: #1f2937;
    }

    @media (max-width: 760px) {
      .controls { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Electromagnetic Radiation Spectrum</h1>
    <p>Entire spectrum on x-axis (log scale): from gamma rays to radio waves. Move the slider to sweep wavelength. Visible light (380–750 nm) shows changing color.</p>

    <div id="axis" class="axis">
      <div id="indicator" class="indicator" aria-hidden="true"></div>
    </div>
    <div id="ticks" class="ticks"></div>

    <section class="controls">
      <input id="slider" type="range" min="-12" max="3" step="0.001" value="-6.4" aria-label="Wavelength exponent in meters" />
      <div class="readout">
        <div id="value">Wavelength: 400 nm (Visible)</div>
        <div id="sample" class="sample"></div>
      </div>
    </section>
  </main>

  <script>
    const MIN_EXP = -12;
    const MAX_EXP = 3;

    const axis = document.getElementById('axis');
    const ticks = document.getElementById('ticks');
    const slider = document.getElementById('slider');
    const indicator = document.getElementById('indicator');
    const value = document.getElementById('value');
    const sample = document.getElementById('sample');

    function toPercent(expM) {
      return ((expM - MIN_EXP) / (MAX_EXP - MIN_EXP)) * 100;
    }

    function addBand(label, startExp, endExp, color) {
      const d = document.createElement('div');
      d.className = 'band';
      d.style.left = `${toPercent(startExp)}%`;
      d.style.width = `${toPercent(endExp) - toPercent(startExp)}%`;
      d.style.background = color;
      d.textContent = label;
      axis.appendChild(d);
    }

    addBand('Gamma', -12, -10, '#4c1d95');
    addBand('X-ray', -10, -8, '#1d4ed8');
    addBand('Ultraviolet', -8, Math.log10(380e-9), '#0f766e');
    addBand('Visible', Math.log10(380e-9), Math.log10(750e-9), '#334155');
    addBand('Infrared', Math.log10(750e-9), -3, '#a16207');
    addBand('Microwave', -3, -1, '#b45309');
    addBand('Radio', -1, 3, '#7f1d1d');

    const visibleStrip = document.createElement('div');
    visibleStrip.className = 'visible-strip';
    visibleStrip.style.left = `${toPercent(Math.log10(380e-9))}%`;
    visibleStrip.style.width = `${toPercent(Math.log10(750e-9)) - toPercent(Math.log10(380e-9))}%`;
    axis.appendChild(visibleStrip);

    for (let e = -12; e <= 3; e += 3) {
      const t = document.createElement('div');
      t.className = 'tick';
      t.style.left = `${toPercent(e)}%`;
      t.innerHTML = `10<sup>${e}</sup> m`;
      ticks.appendChild(t);
    }

    function classify(expM) {
      if (expM < -10) return 'Gamma';
      if (expM < -8) return 'X-ray';
      if (expM < Math.log10(380e-9)) return 'Ultraviolet';
      if (expM <= Math.log10(750e-9)) return 'Visible';
      if (expM < -3) return 'Infrared';
      if (expM < -1) return 'Microwave';
      return 'Radio';
    }

    function formatMeters(m) {
      const nm = m * 1e9;
      if (nm < 1000) return `${nm.toFixed(1)} nm`;
      if (nm < 1e6) return `${(nm / 1e3).toFixed(2)} µm`;
      if (nm < 1e9) return `${(nm / 1e6).toFixed(2)} mm`;
      return `${m.toExponential(2)} m`;
    }

    function wavelengthToRGB(nm) {
      let r = 0, g = 0, b = 0;
      if (nm >= 380 && nm < 440) {
        r = -(nm - 440) / 60; b = 1;
      } else if (nm < 490) {
        g = (nm - 440) / 50; b = 1;
      } else if (nm < 510) {
        g = 1; b = -(nm - 510) / 20;
      } else if (nm < 580) {
        r = (nm - 510) / 70; g = 1;
      } else if (nm < 645) {
        r = 1; g = -(nm - 645) / 65;
      } else if (nm <= 750) {
        r = 1;
      }
      const factor = nm < 420 ? 0.3 + 0.7 * (nm - 380) / 40 : nm <= 700 ? 1 : 0.3 + 0.7 * (750 - nm) / 50;
      const to255 = (c) => Math.max(0, Math.min(255, Math.round(255 * Math.pow(c * Math.max(0, factor), 0.8))));
      return [to255(r), to255(g), to255(b)];
    }

    function update() {
      const expM = Number(slider.value);
      const wavelengthM = Math.pow(10, expM);
      const wavelengthNm = wavelengthM * 1e9;
      indicator.style.left = `${toPercent(expM)}%`;

      const band = classify(expM);
      value.textContent = `Wavelength: ${formatMeters(wavelengthM)} (${band})`;

      if (band === 'Visible') {
        const [r, g, b] = wavelengthToRGB(wavelengthNm);
        sample.style.background = `rgb(${r}, ${g}, ${b})`;
      } else {
        sample.style.background = '#1f2937';
      }
    }

    slider.addEventListener('input', update);
    update();
  </script>
</body>
</html>
